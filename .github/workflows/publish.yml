name: Publish

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
  GITOPS_REPO: vahan-sahakyan/distributed-social-network-gitops

jobs:
  # each arch builds natively and is pushed by digest; images-merge tags the multi-arch manifest
  images:
    name: image (${{ matrix.name }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name:
          - gateway-service
          - posts-service
          - comments-service
          - likes-service
          - feed-service
          - users-service
          - media-service
          - notification-service
          - event-writer-service
          - cache-rebuilder-service
          - search-service
          - ui
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.name == 'ui' && 'ui' || '.' }}
          file: ${{ matrix.name == 'ui' && 'ui/Dockerfile' || format('services/{0}/Dockerfile', matrix.name) }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}
      - run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  images-merge:
    name: manifest (${{ matrix.name }})
    needs: images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name:
          - gateway-service
          - posts-service
          - comments-service
          - likes-service
          - feed-service
          - users-service
          - media-service
          - notification-service
          - event-writer-service
          - cache-rebuilder-service
          - search-service
          - ui
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.name }}-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          tags=(-t "$IMAGE:$GITHUB_SHA")
          [ "$MAIN" = true ] && tags+=(-t "$IMAGE:main")
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA"

  # minio is built once per release, for both archs so compose works on any machine
  minio-check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        run: |
          if docker manifest inspect "$IMAGE_PREFIX/minio:$MINIO_RELEASE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  minio-build:
    needs: minio-check
    if: needs.minio-check.outputs.exists != 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/images/minio
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/minio:${{ env.MINIO_RELEASE }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  minio-merge:
    needs: minio-build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create -t "$IMAGE_PREFIX/minio:$MINIO_RELEASE" \
            "$IMAGE_PREFIX/minio:$MINIO_RELEASE-amd64" "$IMAGE_PREFIX/minio:$MINIO_RELEASE-arm64"

  # points the gitops repo at this commit: images and charts move together
  deploy:
    needs: [images-merge, minio-merge]
    if: >-
      always() && github.ref == 'refs/heads/main'
      && needs.images-merge.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.minio-merge.result)
    runs-on: ubuntu-latest
    concurrency:
      group: gitops-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
      - name: bump prod to ${{ github.sha }}
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # runs for consecutive merges can finish out of order; an older one must not
          # re-pin prod behind a newer commit, whose own run deploys it
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          [ "$head" = "$SHA" ] || { echo "main is at ${head:0:7} now, skipping ${SHA:0:7}"; exit 0; }
          yq -i '.image.tag = strenv(SHA)' envs/prod/services-values.yaml
          for app in apps/infra.yaml apps/services.yaml; do
            yq -i '(.spec.sources[] | select(.repoURL == "https://github.com/${{ github.repository }}.git")).targetRevision = strenv(SHA)' "$app"
          done
          # apps-local is a Helm chart: its templates read the revision from values
          yq -i '.appRevision = strenv(SHA)' apps-local/values.yaml
          git diff --quiet && { echo "already at $SHA"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "[deploy] prod ${SHA:0:7}"
          for _ in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
