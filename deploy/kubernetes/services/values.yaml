replicaCount: 1

image:
  repository: ghcr.io/vahan-sahakyan/distributed-social-network
  # git sha of the app repo; environments pin it, CI bumps it
  tag: main
  pullPolicy: IfNotPresent

# default container resources, overridable per service
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# public base URL, e.g. https://dsn.example.com; sets the gateway's OIDC_ISSUER
# (keycloak's frontend URL + /auth/realms/dsn). Empty leaves the issuer unchecked
publicUrl: ""

# OTLP/HTTP collector for traces, e.g. http://jaeger:4318; empty turns tracing off
otelEndpoint: ""

# Gateway API: an HTTPRoute for the app, on the chart's own Gateway or on parentRefs
route:
  enabled: true
  # hostname the app answers on; keeps <name>.localhost routes of other charts apart
  host: localhost
  # https listeners with a cert-manager certificate for host, http redirects to it
  tls: false
  clusterIssuer: letsencrypt
  # more names on the certificate, so other charts' routes get https too. No wildcards
  # under single-label names: TLS clients reject *.localhost
  extraHosts: []
  # public https port when it isn't 443, for the redirect (k3d maps 8443)
  httpsPort: null
  gateway:
    create: true
    className: traefik
    # traefik binds listeners to its entrypoints by port: web 8000, websecure 8443
    httpPort: 8000
    httpsPort: 8443
  # a shared Gateway to attach to instead, when gateway.create is false
  parentRefs: []

# Secrets come from the secret store (OpenBao) through External Secrets:
# <secret>: {from: <store entry>, data: {<key>: <template over the entry's fields>}}
secretStore:
  kind: ClusterSecretStore
  name: openbao
  refreshInterval: 1h
secrets:
  comments-service:
    from: postgres
    data:
      DATABASE_URL: "postgres://postgres:{{ .password }}@comments-db:5432/comments?sslmode=disable"
  likes-service:
    from: postgres
    data:
      DATABASE_URL: "postgres://postgres:{{ .password }}@likes-db:5432/likes?sslmode=disable"
  users-service:
    from: postgres
    data:
      DATABASE_URL: "postgres://postgres:{{ .password }}@users-db:5432/users?sslmode=disable"
  notification-service:
    from: postgres
    data:
      DATABASE_URL: "postgres://postgres:{{ .password }}@notifications-db:5432/notifications?sslmode=disable"
  media-service:
    from: minio
    data:
      MINIO_ACCESS_KEY: "{{ .user }}"
      MINIO_SECRET_KEY: "{{ .password }}"

services:
  gateway:
    port: 8080
    env:
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081
      FEED_SERVICE_GRPC_ADDR: feed-service:9082
      COMMENTS_SERVICE_GRPC_ADDR: comments-service:9083
      LIKES_SERVICE_GRPC_ADDR: likes-service:9084
      USERS_SERVICE_GRPC_ADDR: users-service:9085
      MEDIA_SERVICE_GRPC_ADDR: media-service:9086
      NOTIFICATIONS_SERVICE_GRPC_ADDR: notification-service:9087
      CACHE_REBUILDER_SERVICE_GRPC_ADDR: cache-rebuilder-service:9089
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: images
      # the gateway trusts tokens signed with these keys; OIDC_ISSUER is added from publicUrl
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/dsn/protocol/openid-connect/certs
      SEARCH_SERVICE_GRPC_ADDR: search-service:9091

  posts:
    port: 8081
    grpcPort: 9081
    env:
      SCYLLA_HOSTS: posts-db:9042
      SCYLLA_KEYSPACE: posts
      KAFKA_BROKERS: redpanda:9092

  feed:
    port: 8082
    grpcPort: 9082
    env:
      KAFKA_BROKERS: redpanda:9092
      MEMCACHED_ADDR: memcached:11211
      USERS_SERVICE_GRPC_ADDR: users-service:9085
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081

  comments:
    port: 8083
    grpcPort: 9083
    secret: true
    env:
      KAFKA_BROKERS: redpanda:9092
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081

  likes:
    port: 8084
    grpcPort: 9084
    secret: true
    env:
      KAFKA_BROKERS: redpanda:9092
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081

  users:
    port: 8085
    grpcPort: 9085
    secret: true
    env:
      KAFKA_BROKERS: redpanda:9092

  media:
    secret: true
    port: 8086
    grpcPort: 9086
    env:
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: images

  notification:
    port: 8087
    grpcPort: 9087
    secret: true
    env:
      KAFKA_BROKERS: redpanda:9092
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081

  event-writer:
    port: 8088
    env:
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default

  cache-rebuilder:
    port: 8089
    grpcPort: 9089
    env:
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default
      MEMCACHED_ADDR: memcached:11211
      USERS_SERVICE_GRPC_ADDR: users-service:9085
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081

  search:
    port: 8091
    grpcPort: 9091
    env:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KAFKA_BROKERS: redpanda:9092

  ui:
    image: ui
    port: 8080
