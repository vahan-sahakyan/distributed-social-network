replicaCount: 1

image:
  repository: ghcr.io/vahan-sahakyan/distributed-social-network
  # git sha of the app repo; environments pin it, CI bumps it
  tag: main
  pullPolicy: IfNotPresent

# default container resources, overridable per service
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

ingress:
  enabled: true
  className: traefik
  # empty host matches any, handy locally
  host: ""
  tls: false
  clusterIssuer: letsencrypt

# plain secrets for local clusters; set false where secrets come from elsewhere
# (helm merges maps, so emptying devSecrets would not remove them)
createDevSecrets: true
devSecrets:
  comments-service:
    DATABASE_URL: postgres://postgres:postgres@comments-db:5432/comments?sslmode=disable
  likes-service:
    DATABASE_URL: postgres://postgres:postgres@likes-db:5432/likes?sslmode=disable
  users-service:
    DATABASE_URL: postgres://postgres:postgres@users-db:5432/users?sslmode=disable
  notification-service:
    DATABASE_URL: postgres://postgres:postgres@notifications-db:5432/notifications?sslmode=disable
  media-service:
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin

services:
  gateway:
    port: 8080
    env:
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081
      FEED_SERVICE_GRPC_ADDR: feed-service:9082
      COMMENTS_SERVICE_GRPC_ADDR: comments-service:9083
      LIKES_SERVICE_GRPC_ADDR: likes-service:9084
      USERS_SERVICE_GRPC_ADDR: users-service:9085
      MEDIA_SERVICE_GRPC_ADDR: media-service:9086
      NOTIFICATIONS_SERVICE_GRPC_ADDR: notification-service:9087
      CACHE_REBUILDER_SERVICE_GRPC_ADDR: cache-rebuilder-service:9089
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: images
      # the gateway trusts tokens signed with these keys; OIDC_ISSUER is added from ingress.host
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/dsn/protocol/openid-connect/certs

  posts:
    port: 8081
    grpcPort: 9081
    env:
      SCYLLA_HOSTS: posts-db:9042
      SCYLLA_KEYSPACE: posts
      KAFKA_BROKERS: redpanda:9092

  feed:
    port: 8082
    grpcPort: 9082
    env:
      KAFKA_BROKERS: redpanda:9092
      MEMCACHED_ADDR: memcached:11211
      USERS_SERVICE_GRPC_ADDR: users-service:9085
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081

  comments:
    port: 8083
    grpcPort: 9083
    secret: true
    env:
      KAFKA_BROKERS: redpanda:9092
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081

  likes:
    port: 8084
    grpcPort: 9084
    secret: true
    env:
      KAFKA_BROKERS: redpanda:9092
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081

  users:
    port: 8085
    grpcPort: 9085
    secret: true
    env:
      KAFKA_BROKERS: redpanda:9092

  media:
    secret: true
    port: 8086
    grpcPort: 9086
    env:
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: images

  notification:
    port: 8087
    grpcPort: 9087
    secret: true
    env:
      KAFKA_BROKERS: redpanda:9092
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081

  event-writer:
    port: 8088
    env:
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default

  cache-rebuilder:
    port: 8089
    grpcPort: 9089
    env:
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default
      MEMCACHED_ADDR: memcached:11211
      USERS_SERVICE_GRPC_ADDR: users-service:9085
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081

  ui:
    image: ui
    port: 8080
