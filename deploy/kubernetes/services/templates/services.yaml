{{- range $name, $svc := .Values.services }}
{{- if ne $svc.enabled false }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-service
  labels:
    app: {{ $name }}-service
spec:
  selector:
    app: {{ $name }}-service
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
    {{- if $svc.grpcPort }}
    - name: grpc
      port: {{ $svc.grpcPort }}
      targetPort: {{ $svc.grpcPort }}
    {{- end }}
  type: ClusterIP
{{- if and $.Values.serviceMonitor.enabled (ne $svc.metrics false) }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}-service
spec:
  selector:
    matchLabels:
      app: {{ $name }}-service
  endpoints:
    - port: http
{{- end }}
{{- end }}
{{- end }}
