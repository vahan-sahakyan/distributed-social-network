{{- range $name, $svc := .Values.services }}
{{- if ne $svc.enabled false }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  labels:
    app: {{ $name }}-service
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}-service
  template:
    metadata:
      labels:
        app: {{ $name }}-service
    spec:
      {{- $security := $svc.security | default $.Values.security }}
      securityContext:
        {{- include "dsn.podSecurityContext" $security | nindent 8 }}
      containers:
        - name: {{ $name }}-service
          image: "{{ $.Values.image.repository }}/{{ $svc.image | default (printf "%s-service" $name) }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- include "dsn.securityContext" $security | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
            {{- if $svc.grpcPort }}
            - name: grpc
              containerPort: {{ $svc.grpcPort }}
            {{- end }}
          env:
            - name: PORT
              value: "{{ $svc.port }}"
            {{- if $svc.grpcPort }}
            - name: GRPC_PORT
              value: "{{ $svc.grpcPort }}"
            {{- end }}
            {{- range $key, $val := $svc.env }}
            {{- /* an address of a switched-off service is left empty: the service reads that as off */}}
            {{- $target := index $.Values.services (index (splitList ":" (toString $val)) 0 | trimSuffix "-service") }}
            - name: {{ $key }}
              value: {{ if and $target (eq $target.enabled false) }}""{{ else }}{{ $val | quote }}{{ end }}
            {{- end }}
            {{- with $.Values.otelEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- if and (eq $name "gateway") $.Values.publicUrl }}
            - name: OIDC_ISSUER
              value: "{{ trimSuffix "/" $.Values.publicUrl }}/auth/realms/dsn"
            {{- end }}
          {{- if $svc.secret }}
          envFrom:
            - secretRef:
                name: {{ $name }}-service
          {{- end }}
          resources:
            {{- toYaml ($svc.resources | default $.Values.resources) | nindent 12 }}
          # /health serves only once dependencies are connected; services retry them
          # in-process, so allow up to 5 minutes before liveness takes over
          startupProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- if gt (int $.Values.replicaCount) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-service
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ $name }}-service
{{- end }}
{{- end }}
{{- end }}
