{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  labels:
    app: {{ $name }}-service
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}-service
  template:
    metadata:
      labels:
        app: {{ $name }}-service
    spec:
      containers:
        - name: {{ $name }}-service
          image: "{{ $.Values.image.repository }}/{{ $svc.image | default (printf "%s-service" $name) }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
            {{- if $svc.grpcPort }}
            - name: grpc
              containerPort: {{ $svc.grpcPort }}
            {{- end }}
          env:
            - name: PORT
              value: "{{ $svc.port }}"
            {{- if $svc.grpcPort }}
            - name: GRPC_PORT
              value: "{{ $svc.grpcPort }}"
            {{- end }}
            {{- range $key, $val := $svc.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- if and (eq $name "gateway") $.Values.ingress.host }}
            - name: OIDC_ISSUER
              value: "{{ if $.Values.ingress.tls }}https{{ else }}http{{ end }}://{{ $.Values.ingress.host }}/auth/realms/dsn"
            {{- end }}
          {{- if $svc.secret }}
          envFrom:
            - secretRef:
                name: {{ $name }}-service
          {{- end }}
          resources:
            {{- toYaml ($svc.resources | default $.Values.resources) | nindent 12 }}
          # /health serves only once dependencies are connected; services retry them
          # in-process, so allow up to 5 minutes before liveness takes over
          startupProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            periodSeconds: 5
{{- end }}
