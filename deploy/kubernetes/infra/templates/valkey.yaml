---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      securityContext:
        {{- include "dsn.podSecurityContext" .Values.valkey.security | nindent 8 }}
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          securityContext:
            {{- include "dsn.securityContext" .Values.valkey.security | nindent 12 }}
          # a pure cache: nothing persisted, so no volume; the services refill it
          args: [valkey-server, --save, "", --appendonly, "no",
                 --maxmemory, {{ .Values.valkey.maxmemory | quote }}, --maxmemory-policy, allkeys-lru]
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: [valkey-cli, ping]
            initialDelaySeconds: 3
            periodSeconds: 5
          # the working dir; nothing is written to it
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
