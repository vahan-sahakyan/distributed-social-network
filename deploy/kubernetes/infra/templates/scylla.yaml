---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: posts-db
  labels:
    app: posts-db
spec:
  replicas: 1
  serviceName: posts-db-headless
  # volumes outlive the StatefulSet: deleting or pruning it never deletes data
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: posts-db
  template:
    metadata:
      labels:
        app: posts-db
    spec:
      containers:
        - name: posts-db
          image: {{ .Values.scylla.image }}
          resources:
            {{- toYaml .Values.scylla.resources | nindent 12 }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          # CQL on every interface, so kubectl port-forward (which dials localhost in the
          # pod) reaches it; clients are still told the pod IP
          args: [--smp, "1", --memory, 512M, --overprovisioned, "1",
                 --rpc-address, 0.0.0.0, --broadcast-rpc-address, $(POD_IP)]
          ports:
            - containerPort: 9042
          volumeMounts:
            - name: data
              mountPath: /var/lib/scylla
          # CQL opens only once Scylla can serve queries; `nodetool status` with the
          # default 1s timeout crashed under load and marked a healthy node unready
          readinessProbe:
            tcpSocket:
              port: 9042
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.scylla.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: posts-db
spec:
  selector:
    app: posts-db
  ports:
    - port: 9042
      targetPort: 9042
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: posts-db-headless
spec:
  clusterIP: None
  selector:
    app: posts-db
  ports:
    - port: 9042
      targetPort: 9042
