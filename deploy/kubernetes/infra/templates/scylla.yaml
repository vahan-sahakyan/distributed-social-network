---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: posts-db
  labels:
    app: posts-db
spec:
  replicas: 1
  serviceName: posts-db-headless
  # volumes outlive the StatefulSet: deleting or pruning it never deletes data
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: posts-db
  template:
    metadata:
      labels:
        app: posts-db
    spec:
      containers:
        - name: posts-db
          image: {{ .Values.scylla.image }}
          resources:
            {{- toYaml .Values.scylla.resources | nindent 12 }}
          args: [--smp, "1", --memory, 512M, --overprovisioned, "1"]
          ports:
            - containerPort: 9042
          volumeMounts:
            - name: data
              mountPath: /var/lib/scylla
          readinessProbe:
            exec:
              command: [nodetool, status]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.scylla.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: posts-db
spec:
  selector:
    app: posts-db
  ports:
    - port: 9042
      targetPort: 9042
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: posts-db-headless
spec:
  clusterIP: None
  selector:
    app: posts-db
  ports:
    - port: 9042
      targetPort: 9042
