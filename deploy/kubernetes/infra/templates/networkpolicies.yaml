{{- if .Values.networkPolicy.enabled }}
{{- range $app, $rules := .Values.networkPolicy.ingress }}
{{- if or (ne $app "postgres") $.Values.postgres.enabled }}
---
{{ include "dsn.networkPolicy" (dict "app" $app "rules" $rules "gateway" $.Values.networkPolicy.gateway) }}
{{- end }}
{{- end }}
{{- end }}
