{{- /*
One CloudNativePG Cluster per database. Its owner (named after the database) gets its
credentials in the operator-made <cluster>-app secret; services connect through a PgBouncer
Pooler (<cluster>-pooler), others to <cluster>-rw. WAL and nightly base backups go to S3
through the Barman Cloud plugin.
*/}}
{{- $pg := .Values.postgres }}
{{- if $pg.backup.enabled }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-backups
spec:
  # each cluster writes under its own name
  configuration:
    destinationPath: s3://{{ $pg.backup.bucket }}/
    endpointURL: {{ $pg.backup.endpointURL }}
    s3Credentials:
      accessKeyId:
        name: {{ $pg.backup.credentials.secret }}
        key: {{ $pg.backup.credentials.accessKeyId }}
      secretAccessKey:
        name: {{ $pg.backup.credentials.secret }}
        key: {{ $pg.backup.credentials.secretAccessKey }}
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: {{ $pg.backup.retention }}
  instanceSidecarConfiguration:
    resources:
      {{- toYaml $pg.backup.sidecarResources | nindent 6 }}
{{- end }}
{{- range $name, $db := $pg.clusters }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $name }}
spec:
  instances: {{ $pg.instances }}
  imageName: {{ $pg.image }}
  # on every pod, service and volume of the cluster; the NetworkPolicies select on it
  inheritedMetadata:
    labels:
      app: {{ $name }}
  bootstrap:
    initdb:
      database: {{ $db.database }}
      owner: {{ $db.database }}
  postgresql:
    parameters:
      {{- toYaml $pg.parameters | nindent 6 }}
  storage:
    size: {{ $pg.storage }}
  resources:
    {{- toYaml $pg.resources | nindent 4 }}
  {{- if $pg.backup.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backups
{{- end }}
{{- if $pg.backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $name }}
spec:
  cluster:
    name: {{ $name }}
  schedule: {{ $pg.backup.schedule | quote }}
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
{{- if ne $db.pooler false }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ $name }}-pooler
spec:
  cluster:
    name: {{ $name }}
  instances: {{ $pg.pooler.instances }}
  type: rw
  pgbouncer:
    # pgx prepares statements; pgbouncer keeps them per server connection
    poolMode: transaction
    parameters:
      {{- toYaml $pg.pooler.parameters | nindent 6 }}
  template:
    metadata:
      labels:
        app: {{ $name }}-pooler
    spec:
      containers:
        - name: pgbouncer
          resources:
            {{- toYaml $pg.pooler.resources | nindent 12 }}
{{- end }}
{{- if $.Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $name }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ $name }}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
{{- end }}
{{- end }}
