{{- if .Values.postgres.enabled }}
{{- $pg := .Values.postgres }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  {{- (.Files.Glob "files/postgres-init.sh").AsConfig | nindent 2 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  serviceName: postgres-headless
  # volumes outlive the StatefulSet: deleting or pruning it never deletes data
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        {{- include "dsn.podSecurityContext" $pg.security | nindent 8 }}
      containers:
        - name: postgres
          image: {{ $pg.image }}
          securityContext:
            {{- include "dsn.securityContext" $pg.security | nindent 12 }}
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          env:
            - name: POSTGRES_USER
              value: {{ $pg.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASES
              value: {{ join " " $pg.databases | quote }}
          ports:
            - containerPort: 5432
          volumeMounts:
            # 18's layout: data in 18/docker under the mount
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: [pg_isready, -U, {{ $pg.user }}]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: postgres-init
            # executed, not sourced, by the image's entrypoint
            defaultMode: 0555
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ $pg.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
