---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  dsn-realm.json: |-
    {{- .Files.Get "files/dsn-realm.json" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        # a realm change restarts Keycloak; it only imports into an empty database
        checksum/realm: {{ .Files.Get "files/dsn-realm.json" | sha256sum }}
    spec:
      # Keycloak exits when its database isn't up yet; wait instead of crash-looping
      initContainers:
        - name: wait-for-db
          image: {{ .Values.postgres.image }}
          command: [sh, -c, "until pg_isready -h keycloak-db -U {{ .Values.postgres.user }}; do sleep 2; done"]
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: [start, --import-realm]
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          env:
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            # behind the gateway: the public address comes from X-Forwarded-*
            - name: KC_PROXY_HEADERS
              value: xforwarded
            {{- if .Values.keycloak.hostname }}
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.hostname | quote }}
            {{- else }}
            - name: KC_HOSTNAME_STRICT
              value: "false"
            {{- end }}
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-db:5432/keycloak
            - name: KC_DB_USERNAME
              value: {{ .Values.postgres.user }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: KEYCLOAK_ADMIN
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: KEYCLOAK_ADMIN_PASSWORD
            {{- with .Values.keycloak.uiUrl }}
            # realm file placeholder; unset, logins only redirect back to the local dev UI
            - name: DSN_UI_URL
              value: {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          startupProbe:
            httpGet:
              path: /auth/health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /auth/health/live
              port: management
            periodSeconds: 20
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
