{{- if .Values.elasticsearch.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels:
    app: elasticsearch
spec:
  replicas: 1
  serviceName: elasticsearch-headless
  # volumes outlive the StatefulSet: deleting or pruning it never deletes data
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      securityContext:
        {{- include "dsn.podSecurityContext" .Values.elasticsearch.security | nindent 8 }}
      containers:
        - name: elasticsearch
          image: {{ .Values.elasticsearch.image }}
          securityContext:
            {{- include "dsn.securityContext" .Values.elasticsearch.security | nindent 12 }}
          resources:
            {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
          env:
            - name: discovery.type
              value: single-node
            # in-cluster only; see docs/search.md
            - name: xpack.security.enabled
              value: "false"
            # avoids the host-level vm.max_map_count requirement
            - name: node.store.allow_mmap
              value: "false"
            - name: ES_JAVA_OPTS
              value: {{ .Values.elasticsearch.javaOpts | quote }}
            {{- range $key, $val := .Values.elasticsearch.settings }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 9200
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            periodSeconds: 5
            failureThreshold: 60
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.elasticsearch.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
spec:
  clusterIP: None
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
{{- end }}
