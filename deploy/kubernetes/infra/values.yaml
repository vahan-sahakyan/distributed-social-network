postgres:
  image: postgres:16.14-alpine
  user: postgres
  # image uids; Pod Security "restricted", see templates/_helpers.tpl
  security: {user: 70, readOnly: true}
  # password comes from the postgres-credentials secret (POSTGRES_PASSWORD)
  storage: 1Gi
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
  instances:
    comments-db:
      database: comments
    likes-db:
      database: likes
    users-db:
      database: users
    notifications-db:
      database: notifications
    keycloak-db:
      database: keycloak

scylla:
  image: scylladb/scylla:2026.1.5
  # the entrypoint writes /etc/scylla on start
  security: {user: 999, fsGroup: 1000}
  storage: 2Gi
  resources:
    requests: {cpu: 100m, memory: 768Mi}
    limits: {memory: 1Gi}

redpanda:
  image: redpandadata/redpanda:v26.1.10
  # writes /etc/redpanda/redpanda.yaml on start
  security: {user: 101}
  storage: 1Gi
  resources:
    requests: {cpu: 100m, memory: 640Mi}
    limits: {memory: 1Gi}

# feed cache, pure: nothing persisted, least recently used keys evicted at maxmemory
valkey:
  image: valkey/valkey:9.1.2-alpine
  security: {user: 999, fsGroup: 1000, readOnly: true}
  maxmemory: 64mb
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

# event store for event-writer and cache-rebuilder; local clusters may switch it off
clickhouse:
  enabled: true
  image: clickhouse/clickhouse-server:26.5.1.882
  # writes users.d and logs under / on start
  security: {user: 101}
  storage: 2Gi
  resources:
    requests: {cpu: 100m, memory: 1Gi}
    limits: {memory: 3Gi}

minio:
  # built from source by CI, see deploy/images/minio
  image: ghcr.io/vahan-sahakyan/distributed-social-network/minio:RELEASE.2025-09-07T16-13-09Z
  security: {user: 1000, readOnly: true}
  # root user/password come from the minio-credentials secret
  storage: 5Gi
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {memory: 512Mi}

# search-service's index; local clusters may switch it off
elasticsearch:
  enabled: true
  image: elasticsearch:9.5.3
  # writes its keystore under config/ on start
  security: {user: 1000}
  storage: 2Gi
  javaOpts: -Xms512m -Xmx512m
  # extra node settings as env vars; disk watermarks off so a nearly full local
  # disk doesn't flip the indices to read-only
  settings:
    cluster.routing.allocation.disk.threshold_enabled: "false"
  resources:
    requests: {cpu: 100m, memory: 1Gi}
    limits: {memory: 1536Mi}

keycloak:
  image: quay.io/keycloak/keycloak:26.7.5
  # builds into /opt/keycloak on start
  security: {user: 1000}
  # public origin of the UI, for login redirects, e.g. https://dsn.example.com
  uiUrl: ""
  # public URL of Keycloak, e.g. https://dsn.example.com/auth; empty takes it from
  # each request's forwarded host
  hostname: ""
  # admin user/password come from the keycloak-admin secret
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}

# Secrets come from the secret store (OpenBao) through External Secrets:
# <secret>: {from: <store entry>, data: {<key>: <template over the entry's fields>}}
secretStore:
  kind: ClusterSecretStore
  name: openbao
  refreshInterval: 1h
secrets:
  postgres-credentials:
    from: postgres
    data:
      POSTGRES_PASSWORD: "{{ .password }}"
  minio-credentials:
    from: minio
    data:
      MINIO_ROOT_USER: "{{ .user }}"
      MINIO_ROOT_PASSWORD: "{{ .password }}"
  keycloak-admin:
    from: keycloak-admin
    data:
      KEYCLOAK_ADMIN: "{{ .user }}"
      KEYCLOAK_ADMIN_PASSWORD: "{{ .password }}"

# NetworkPolicies, one per store: only its clients get in (the services chart denies the
# rest). A rule is {from: [app labels], gateway: the Gateway's proxy pods, namespace: any pod
# here, ports: [...]}
networkPolicy:
  enabled: true
  # the pods behind the Gateway (k3s's Traefik)
  gateway:
    namespace: kube-system
    podLabels:
      app.kubernetes.io/name: traefik
  ingress:
    comments-db:
      - from: [comments-service]
    likes-db:
      - from: [likes-service]
    users-db:
      - from: [users-service]
    notifications-db:
      - from: [notification-service]
    keycloak-db:
      - from: [keycloak]
    posts-db:
      - from: [posts-service]
    redpanda:
      - from: [posts-service, feed-service, comments-service, likes-service, users-service,
               notification-service, event-writer-service, search-service, redpanda-console]
      - from: [prometheus]
        ports: [9644]
    valkey:
      - from: [feed-service, cache-rebuilder-service]
    clickhouse:
      - from: [event-writer-service, cache-rebuilder-service]
    minio:
      - from: [media-service, gateway-service]
      # the console route
      - gateway: true
        ports: [9001]
    elasticsearch:
      - from: [search-service, kibana]
    keycloak:
      # jwks for token checks
      - from: [gateway-service]
      - gateway: true
