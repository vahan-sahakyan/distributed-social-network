# CloudNativePG clusters, one per database (templates/postgres.yaml); needs the operator
# and, for backups, its Barman Cloud plugin
postgres:
  image: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
  # per cluster; 2 or more adds streaming standbys and automatic failover
  instances: 1
  storage: 1Gi
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {memory: 384Mi}
  parameters:
    shared_buffers: 64MB
    max_connections: "100"
  # PgBouncer in front of each cluster for the services; pooler: false on a cluster skips it
  pooler:
    instances: 1
    parameters:
      max_prepared_statements: "200"
      default_pool_size: "10"
    resources:
      requests: {cpu: 5m, memory: 16Mi}
      limits: {memory: 64Mi}
  # WAL archiving and nightly base backups to S3 (minio here), kept for retention
  backup:
    enabled: true
    endpointURL: http://minio:9000
    bucket: postgres-backups
    credentials:
      secret: minio-credentials
      accessKeyId: MINIO_ROOT_USER
      secretAccessKey: MINIO_ROOT_PASSWORD
    # seconds first: 03:00 every day
    schedule: "0 0 3 * * *"
    retention: 7d
    # barman-cloud-backup needs ~200Mi while uploading a base backup
    sidecarResources:
      requests: {cpu: 5m, memory: 64Mi}
      limits: {memory: 384Mi}
  clusters:
    comments-db:
      database: comments
    likes-db:
      database: likes
    users-db:
      database: users
    notifications-db:
      database: notifications
    # keycloak keeps its own connection pool
    keycloak-db:
      database: keycloak
      pooler: false

scylla:
  image: scylladb/scylla:2026.1.5
  # the entrypoint writes /etc/scylla on start
  security: {user: 999, fsGroup: 1000}
  storage: 2Gi
  resources:
    requests: {cpu: 100m, memory: 768Mi}
    limits: {memory: 1Gi}

redpanda:
  image: redpandadata/redpanda:v26.1.10
  # writes /etc/redpanda/redpanda.yaml on start
  security: {user: 101}
  storage: 1Gi
  resources:
    requests: {cpu: 100m, memory: 640Mi}
    limits: {memory: 1Gi}

# feed cache, pure: nothing persisted, least recently used keys evicted at maxmemory
valkey:
  image: valkey/valkey:9.1.2-alpine
  security: {user: 999, fsGroup: 1000, readOnly: true}
  maxmemory: 64mb
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

# event store for event-writer and cache-rebuilder; local clusters may switch it off
clickhouse:
  enabled: true
  image: clickhouse/clickhouse-server:26.5.1.882
  # writes users.d and logs under / on start
  security: {user: 101}
  storage: 2Gi
  resources:
    requests: {cpu: 100m, memory: 1Gi}
    limits: {memory: 3Gi}

minio:
  # built from source by CI, see deploy/images/minio
  image: ghcr.io/vahan-sahakyan/distributed-social-network/minio:RELEASE.2025-09-07T16-13-09Z
  security: {user: 1000, readOnly: true}
  # root user/password come from the minio-credentials secret
  storage: 5Gi
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {memory: 512Mi}

# search-service's index; local clusters may switch it off
elasticsearch:
  enabled: true
  image: elasticsearch:9.5.3
  # writes its keystore under config/ on start
  security: {user: 1000}
  storage: 2Gi
  javaOpts: -Xms512m -Xmx512m
  # extra node settings as env vars; disk watermarks off so a nearly full local
  # disk doesn't flip the indices to read-only
  settings:
    cluster.routing.allocation.disk.threshold_enabled: "false"
  resources:
    requests: {cpu: 100m, memory: 1Gi}
    limits: {memory: 1536Mi}

keycloak:
  image: quay.io/keycloak/keycloak:26.7.5
  # builds into /opt/keycloak on start
  security: {user: 1000}
  # public origin of the UI, for login redirects, e.g. https://dsn.example.com; "/" for
  # any origin the app is served on (a bare IP that changes on restart)
  uiUrl: ""
  # public URL of Keycloak, e.g. https://dsn.example.com/auth; empty takes it from
  # each request's forwarded host
  hostname: ""
  # admin user/password come from the keycloak-admin secret
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}

# Secrets come from the secret store (OpenBao) through External Secrets:
# <secret>: {from: <store entry>, data: {<key>: <template over the entry's fields>}}
secretStore:
  kind: ClusterSecretStore
  name: openbao
  refreshInterval: 1h
secrets:
  minio-credentials:
    from: minio
    data:
      MINIO_ROOT_USER: "{{ .user }}"
      MINIO_ROOT_PASSWORD: "{{ .password }}"
  keycloak-admin:
    from: keycloak-admin
    data:
      KEYCLOAK_ADMIN: "{{ .user }}"
      KEYCLOAK_ADMIN_PASSWORD: "{{ .password }}"

# a ServiceMonitor for redpanda's /public_metrics, for a Prometheus Operator Prometheus;
# needs the operator's CRDs
serviceMonitor:
  enabled: false

# NetworkPolicies, one per store: only its clients get in (the services chart denies the
# rest). A rule is {from: [app labels], gateway: the Gateway's proxy pods, namespace: any pod
# here, ports: [...]}
networkPolicy:
  enabled: true
  # the pods behind the Gateway (k3s's Traefik)
  gateway:
    namespace: kube-system
    podLabels:
      app.kubernetes.io/name: traefik
  # the CloudNativePG operator, which manages the instances through their port 8000
  operator:
    namespace: cnpg-system
    podLabels:
      app.kubernetes.io/name: cloudnative-pg
  ingress:
    # a cluster's instances: its pooler and clients, each other (replication), the
    # operator, prometheus on the metrics port
    comments-db:
      - from: [comments-db-pooler]
        ports: [5432]
      - from: [comments-db]
      - operator: true
        ports: [8000]
      - from: [prometheus]
        ports: [9187]
    comments-db-pooler:
      - from: [comments-service]
    likes-db:
      - from: [likes-db-pooler]
        ports: [5432]
      - from: [likes-db]
      - operator: true
        ports: [8000]
      - from: [prometheus]
        ports: [9187]
    likes-db-pooler:
      - from: [likes-service]
    users-db:
      - from: [users-db-pooler]
        ports: [5432]
      - from: [users-db]
      - operator: true
        ports: [8000]
      - from: [prometheus]
        ports: [9187]
    users-db-pooler:
      - from: [users-service]
    notifications-db:
      - from: [notifications-db-pooler]
        ports: [5432]
      - from: [notifications-db]
      - operator: true
        ports: [8000]
      - from: [prometheus]
        ports: [9187]
    notifications-db-pooler:
      - from: [notification-service]
    keycloak-db:
      - from: [keycloak]
        ports: [5432]
      - from: [keycloak-db]
      - operator: true
        ports: [8000]
      - from: [prometheus]
        ports: [9187]
    posts-db:
      - from: [posts-service]
    redpanda:
      - from: [posts-service, feed-service, comments-service, likes-service, users-service,
               notification-service, event-writer-service, search-service, redpanda-console]
      - from: [prometheus]
        ports: [9644]
    valkey:
      - from: [feed-service, cache-rebuilder-service]
    clickhouse:
      - from: [event-writer-service, cache-rebuilder-service]
    minio:
      - from: [media-service, gateway-service]
      # postgres WAL and base backups
      - from: [comments-db, likes-db, users-db, notifications-db, keycloak-db]
        ports: [9000]
      # the console route
      - gateway: true
        ports: [9001]
    elasticsearch:
      - from: [search-service, kibana]
    keycloak:
      # jwks for token checks
      - from: [gateway-service]
      - gateway: true
