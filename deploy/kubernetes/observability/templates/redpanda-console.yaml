---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  labels:
    app: redpanda-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda-console
  template:
    metadata:
      labels:
        app: redpanda-console
    spec:
      containers:
        - name: redpanda-console
          image: {{ .Values.redpandaConsole.image }}
          env:
            - name: KAFKA_BROKERS
              value: redpanda:9092
          resources:
            {{- toYaml .Values.redpandaConsole.resources | nindent 12 }}
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
spec:
  selector:
    app: redpanda-console
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
