{{- /* Secrets synced from the secret store; templates read the fields of the store entry */}}
{{- range $name, $secret := .Values.secrets }}
{{- if or (not $secret.group) (index $.Values $secret.group).enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
spec:
  refreshInterval: {{ $.Values.secretStore.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.secretStore.kind }}
    name: {{ $.Values.secretStore.name }}
  target:
    name: {{ $name }}
    template:
      data:
        {{- toYaml $secret.data | nindent 8 }}
  dataFrom:
    - extract:
        key: {{ $secret.from }}
{{- end }}
{{- end }}
