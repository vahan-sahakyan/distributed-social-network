{{- /* plain secrets for local clusters; real environments supply their own */}}
{{- if .Values.createDevSecrets }}
{{- range $name, $data := .Values.devSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
stringData:
  {{- toYaml $data | nindent 2 }}
{{- end }}
{{- end }}
