{{- if .Values.stack.enabled }}
# run by the Prometheus Operator: scrapes the namespace's ServiceMonitors and PodMonitors,
# evaluates its PrometheusRules, alerts through alertmanager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
spec:
  image: {{ .Values.prometheus.image }}
  version: {{ splitList ":" .Values.prometheus.image | last }}
  replicas: 1
  serviceAccountName: prometheus
  podMetadata:
    labels:
      app: prometheus
  scrapeInterval: 15s
  evaluationInterval: 15s
  retention: {{ .Values.prometheus.retention }}
  # this namespace only
  serviceMonitorSelector: {}
  podMonitorSelector: {}
  ruleSelector: {}
  alerting:
    alertmanagers:
      - name: alertmanager
        namespace: {{ .Release.Namespace }}
        port: web
        apiVersion: v2
  securityContext:
    {{- include "dsn.podSecurityContext" .Values.prometheus.security | nindent 4 }}
  resources:
    {{- toYaml .Values.prometheus.resources | nindent 4 }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.prometheus.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus
spec:
  selector:
    matchLabels:
      app: prometheus
  endpoints:
    - port: web
---
# the alert rules compose loads from the same file
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dsn
spec:
  {{- .Files.Get "files/prometheus/alerts.yml" | nindent 2 }}
{{- end }}
