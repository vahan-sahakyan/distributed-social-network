{{- if .Values.stack.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  {{- (.Files.Glob "files/prometheus/*.yml").AsConfig | nindent 2 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  serviceName: prometheus
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        {{- include "dsn.podSecurityContext" .Values.prometheus.security | nindent 8 }}
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          securityContext:
            {{- include "dsn.securityContext" .Values.prometheus.security | nindent 12 }}
          # configmap edits reach the mount within a minute and are reloaded, no restart
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --config.auto-reload
            - --config.auto-reload-interval=10s
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: prometheus-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.prometheus.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
{{- end }}
