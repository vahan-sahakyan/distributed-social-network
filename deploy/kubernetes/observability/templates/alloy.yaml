{{- if .Values.stack.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
# reads pod logs through the API, so no node mounts and no cluster-wide access
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  logs.alloy: |
    {{- .Files.Get "files/alloy/kubernetes.alloy" | nindent 4 }}
  traces.alloy: |
    {{- .Files.Get "files/alloy/traces.alloy" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels:
    app: alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
      annotations:
        checksum/config: {{ print (.Files.Get "files/alloy/kubernetes.alloy") (.Files.Get "files/alloy/traces.alloy") | sha256sum }}
    spec:
      serviceAccountName: alloy
      securityContext:
        {{- include "dsn.podSecurityContext" .Values.alloy.security | nindent 8 }}
      containers:
        - name: alloy
          image: {{ .Values.alloy.image }}
          securityContext:
            {{- include "dsn.securityContext" .Values.alloy.security | nindent 12 }}
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            # every .alloy file in the directory
            - /etc/alloy
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TRACE_SAMPLING_PERCENT
              value: {{ .Values.alloy.traceSamplingPercent | quote }}
          resources:
            {{- toYaml .Values.alloy.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: 12345
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
spec:
  selector:
    app: alloy
  ports:
    - name: http
      port: 12345
      targetPort: 12345
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  type: ClusterIP
{{- end }}
