# configs and the dashboard come from monitoring/ (files/ is a symlink), shared with compose

# switches: stack = prometheus, grafana, loki, alloy, jaeger; redpandaConsole and kibana
# on their own. Routes and secrets name the switch they belong to in `group`
stack:
  enabled: true

prometheus:
  image: prom/prometheus:v3.12.0
  storage: 5Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}

grafana:
  image: grafana/grafana:13.0.2
  # admin user/password come from the grafana-admin secret
  storage: 1Gi
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {memory: 512Mi}

loki:
  image: grafana/loki:3.7.2
  storage: 5Gi
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {memory: 512Mi}

# tails the pods of this namespace into loki
alloy:
  image: grafana/alloy:v1.20.1
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 256Mi}

# all-in-one, in-memory: traces are lost on restart.
# 2.21 dropped the /api/services|traces endpoints the grafana jaeger datasource uses
jaeger:
  image: jaegertracing/jaeger:2.20.0
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {memory: 1Gi}

redpandaConsole:
  enabled: true
  image: redpandadata/console:v3.12.0
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 256Mi}

# ~1GB, for poking at the search indices in Dev Tools
kibana:
  enabled: false
  image: kibana:9.5.3
  resources:
    requests: {cpu: 50m, memory: 768Mi}
    limits: {memory: 1536Mi}

# every UI on <name>.<domain> as an HTTPRoute; browsers resolve *.localhost to loopback
route:
  enabled: true
  domain: localhost
  # the services chart's Gateway: its http listener and any https one for <name>.<domain>
  parentRefs:
    - name: dsn
  routes:
    grafana: {group: stack, service: grafana, port: 3000}
    prometheus: {group: stack, service: prometheus, port: 9090}
    jaeger: {group: stack, service: jaeger, port: 16686}
    redpanda: {group: redpandaConsole, service: redpanda-console, port: 8080}
    minio: {service: minio, port: 9001}

# Secrets come from the secret store (OpenBao) through External Secrets:
# <secret>: {from: <store entry>, data: {<key>: <template over the entry's fields>}}
secretStore:
  kind: ClusterSecretStore
  name: openbao
  refreshInterval: 1h
secrets:
  grafana-admin:
    group: stack
    from: grafana-admin
    data:
      GF_SECURITY_ADMIN_USER: "{{ .user }}"
      GF_SECURITY_ADMIN_PASSWORD: "{{ .password }}"
