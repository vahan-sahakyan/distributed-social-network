services:
  # --- Databases ---
  posts-db:
    image: scylladb/scylla:2026.1.5
    command: --smp 1 --memory 512M --overprovisioned 1
    ports:
      - "9042:9042"
    volumes:
      - posts-db-data:/var/lib/scylla

  comments-db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - comments-db-data:/var/lib/postgresql/data

  likes-db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: likes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - likes-db-data:/var/lib/postgresql/data

  users-db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data

  notifications-db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - notifications-db-data:/var/lib/postgresql/data

  # --- Event Store ---
  clickhouse:
    image: clickhouse/clickhouse-server:26.5.1.882
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  # --- Message Broker ---
  redpanda:
    image: redpandadata/redpanda:v26.1.10
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  # one-shot: per-group lag metrics are off by default, and a bootstrap file only
  # applies to a fresh volume
  redpanda-init:
    image: redpandadata/redpanda:v26.1.10
    entrypoint: ["rpk", "cluster", "config", "set", "enable_consumer_group_metrics", '["group","partition","consumer_lag"]', "-X", "admin.hosts=redpanda:9644"]
    restart: on-failure
    depends_on:
      - redpanda

  redpanda-console:
    image: redpandadata/console:latest
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8888:8080"
    depends_on:
      - redpanda

  # --- Identity ---
  keycloak-db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - keycloak-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: [start-dev, --import-realm]
    environment:
      # local only: the admin console is admin/admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
      # tokens carry this issuer however Keycloak was reached (browser, scripts, gateway)
      KC_HOSTNAME: http://localhost:8180/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # plain-http localhost; the realm defaults to requiring https off-host
      DSN_SSL_REQUIRED: none
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
    ports:
      - "8180:8080"
    volumes:
      - ../deploy/kubernetes/infra/files:/opt/keycloak/data/import:ro
    depends_on:
      - keycloak-db

  # --- Search ---
  elasticsearch:
    image: elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      # local only: no TLS or auth
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  # optional, ~1GB: make kibana, then Dev Tools at http://localhost:5601
  kibana:
    image: kibana:9.5.3
    profiles: ["kibana"]
    # land on Dev Tools: the default Elasticsearch home needs the security API, which is off here
    command: [/usr/local/bin/kibana-docker, "--uiSettings.overrides.defaultRoute=/app/dev_tools#/console"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  # --- Cache ---
  memcached:
    image: memcached:1.6.45-alpine
    ports:
      - "11211:11211"

  # --- Object Storage ---
  minio:
    image: ghcr.io/vahan-sahakyan/distributed-social-network/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # --- Observability ---
  prometheus:
    image: prom/prometheus:v3.12.0
    # picks up edits to the mounted config and rules without a restart
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --config.auto-reload
      - --config.auto-reload-interval=10s
    ports:
      - "9090:9090"
    volumes:
      # a directory mount, so edits that replace the file are seen
      - ../monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.0.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/dsn-overview.json
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger

  loki:
    image: grafana/loki:3.7.2
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki

  # tails every compose container's stdout into loki
  alloy:
    image: grafana/alloy:v1.20.1
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ../monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # all-in-one, in-memory: traces are lost on restart.
  # 2.21 dropped the /api/services|traces endpoints the grafana jaeger datasource uses
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  posts-db-data:
  comments-db-data:
  likes-db-data:
  users-db-data:
  notifications-db-data:
  clickhouse-data:
  redpanda-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  elasticsearch-data:
  keycloak-data:
