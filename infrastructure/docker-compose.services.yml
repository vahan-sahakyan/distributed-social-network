x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

services:
  gateway-service:
    build:
      context: ../
      dockerfile: services/gateway-service/Dockerfile
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      <<: *otel
      PORT: "8080"
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081
      FEED_SERVICE_GRPC_ADDR: feed-service:9082
      COMMENTS_SERVICE_GRPC_ADDR: comments-service:9083
      LIKES_SERVICE_GRPC_ADDR: likes-service:9084
      USERS_SERVICE_GRPC_ADDR: users-service:9085
      MEDIA_SERVICE_GRPC_ADDR: media-service:9086
      NOTIFICATIONS_SERVICE_GRPC_ADDR: notification-service:9087
      CACHE_REBUILDER_SERVICE_GRPC_ADDR: cache-rebuilder-service:9089
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: images
    depends_on:
      - posts-service
      - feed-service
      - comments-service
      - likes-service
      - users-service
      - media-service
      - notification-service
      - cache-rebuilder-service

  posts-service:
    build:
      context: ../
      dockerfile: services/posts-service/Dockerfile
    restart: on-failure
    ports:
      - "9081:9081"
    environment:
      <<: *otel
      PORT: "8081"
      GRPC_PORT: "9081"
      SCYLLA_HOSTS: posts-db:9042
      SCYLLA_KEYSPACE: posts
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - posts-db
      - redpanda

  comments-service:
    build:
      context: ../
      dockerfile: services/comments-service/Dockerfile
    restart: on-failure
    ports:
      - "9083:9083"
    environment:
      <<: *otel
      PORT: "8083"
      GRPC_PORT: "9083"
      DATABASE_URL: postgres://postgres:postgres@comments-db:5432/comments?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - comments-db
      - redpanda

  likes-service:
    build:
      context: ../
      dockerfile: services/likes-service/Dockerfile
    restart: on-failure
    ports:
      - "9084:9084"
    environment:
      <<: *otel
      PORT: "8084"
      GRPC_PORT: "9084"
      DATABASE_URL: postgres://postgres:postgres@likes-db:5432/likes?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - likes-db
      - redpanda

  feed-service:
    build:
      context: ../
      dockerfile: services/feed-service/Dockerfile
    restart: on-failure
    ports:
      - "9082:9082"
    environment:
      <<: *otel
      PORT: "8082"
      GRPC_PORT: "9082"
      KAFKA_BROKERS: redpanda:9092
      MEMCACHED_ADDR: memcached:11211
      USERS_SERVICE_GRPC_ADDR: users-service:9085
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081
    depends_on:
      - redpanda
      - memcached
      - users-service
      - posts-service

  users-service:
    build:
      context: ../
      dockerfile: services/users-service/Dockerfile
    restart: on-failure
    ports:
      - "9085:9085"
    environment:
      <<: *otel
      PORT: "8085"
      GRPC_PORT: "9085"
      DATABASE_URL: postgres://postgres:postgres@users-db:5432/users?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - users-db
      - redpanda

  media-service:
    build:
      context: ../
      dockerfile: services/media-service/Dockerfile
    restart: on-failure
    ports:
      - "9086:9086"
    environment:
      <<: *otel
      PORT: "8086"
      GRPC_PORT: "9086"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: images
    depends_on:
      - minio

  notification-service:
    build:
      context: ../
      dockerfile: services/notification-service/Dockerfile
    restart: on-failure
    ports:
      - "9087:9087"
    environment:
      <<: *otel
      PORT: "8087"
      GRPC_PORT: "9087"
      DATABASE_URL: postgres://postgres:postgres@notifications-db:5432/notifications?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081
    depends_on:
      - notifications-db
      - redpanda
      - posts-service

  event-writer-service:
    build:
      context: ../
      dockerfile: services/event-writer-service/Dockerfile
    restart: on-failure
    environment:
      <<: *otel
      PORT: "8088"
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default
    depends_on:
      - redpanda
      - clickhouse

  cache-rebuilder-service:
    build:
      context: ../
      dockerfile: services/cache-rebuilder-service/Dockerfile
    restart: on-failure
    ports:
      - "9089:9089"
    environment:
      <<: *otel
      PORT: "8089"
      GRPC_PORT: "9089"
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default
      MEMCACHED_ADDR: memcached:11211
      USERS_SERVICE_GRPC_ADDR: users-service:9085
      POSTS_SERVICE_GRPC_ADDR: posts-service:9081
    depends_on:
      - clickhouse
      - memcached
      - users-service
      - posts-service

